<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#f4ecdf">
<title>职场古人塑 · 测测你在古代上班是谁</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22%3E%3Crect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%23b23a2a%22/%3E%3Ctext x=%2232%22 y=%2246%22 font-size=%2238%22 text-anchor=%22middle%22 fill=%22white%22%3E古%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <!-- 首页：输入密码 -->
  <section id="home" class="screen">
    <div class="home-top">
      <div class="seal big">古</div>
      <h1 class="title" data-meta="title">职场古人塑</h1>
      <p class="subtitle" data-meta="subtitle">测测你在古代上班是哪位打工人</p>
      <div class="cast" data-meta="cast">诸葛亮 · 苏轼 · 魏征 · 陶渊明 · 萧何 · 张良 · 上官婉儿 · 李白</div>
    </div>
    <form id="codeForm" class="card" autocomplete="off">
      <label for="codeInput" class="label">请输入测试密码</label>
      <input id="codeInput" class="input" inputmode="latin" autocapitalize="characters" spellcheck="false" maxlength="20" placeholder="购买后获得的 8 位密码">
      <p id="codeError" class="error" role="alert"></p>
      <button class="btn primary" type="submit" id="startBtn">开始测试</button>
      <p class="hint">每个密码可测试 3 次 · <span data-meta="intro">20 道题，约 3 分钟</span></p>
    </form>
    <p class="foot" data-meta="footer">本测评仅供娱乐</p>
  </section>

  <!-- 答题 -->
  <section id="quiz" class="screen" hidden>
    <div class="quiz-head">
      <button class="link-btn" id="prevBtn" type="button">‹ 上一题</button>
      <span class="progress-text"><b id="qNum">1</b> / <span id="qTotal">20</span></span>
    </div>
    <div class="bar"><i id="qBar"></i></div>
    <h2 id="qText" class="q-text"></h2>
    <div id="qOptions" class="options"></div>
    <button class="btn primary" id="submitBtn" type="button" hidden>提交，查看结果</button>
  </section>

  <!-- 计算中 -->
  <section id="loading" class="screen center" hidden>
    <div class="seal big spin">卷</div>
    <p class="loading-text">正在翻阅史册，寻找与你相似的古人…</p>
  </section>

  <!-- 结果 -->
  <section id="result" class="screen" hidden>
    <div id="poster" class="poster"></div>
    <div class="actions">
      <button class="btn primary" id="saveBtn" type="button">保存结果长图</button>
      <button class="btn" id="copyBtn" type="button">复制结果链接</button>
      <div class="row owner-only">
        <button class="btn" id="againBtn" type="button">再测一次</button>
        <button class="btn gift" id="giftBtn" type="button">好评有礼</button>
      </div>
      <button class="btn visitor-only" id="tryBtn" type="button">我也要测</button>
      <p id="remainHint" class="hint owner-only"></p>
    </div>
  </section>
</div>

<!-- 弹窗 -->
<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <div id="modalBody"></div>
    <button class="btn primary" id="modalClose" type="button">知道了</button>
  </div>
</div>
<div id="imgModal" class="modal" hidden>
  <div class="img-box">
    <p class="img-tip">长按图片，保存到手机相册</p>
    <div class="img-scroll"><img id="imgOut" alt="测试结果长图"></div>
    <div class="row">
      <a class="btn" id="imgDownload" download="职场古人塑-测试结果.png">下载图片</a>
      <button class="btn primary" id="imgClose" type="button">关闭</button>
    </div>
  </div>
</div>
<div id="toast" class="toast" hidden></div>

<script src="vendor/html2canvas.min.js"></script>
<script src="config.js"></script>
<script src="content.js"></script>
<script src="api.js"></script>
<script src="app.js"></script>
</body>
</html>
